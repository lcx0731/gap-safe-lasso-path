[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gap-safe-lasso-path"
version = "0.1.0"
description = "Auditable Lasso paths with duality-gap stopping and dynamic safe screening"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=2.1,<3", "matplotlib>=3.9,<4", "scikit-learn>=1.5,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
lasso-audit = "gap_safe_lasso.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
